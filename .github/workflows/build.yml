name: Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the tests
        run: python -m unittest discover -s tests -v
      - name: Build the package
        run: |
          mkdir -p dist
          cp app/*.py dist/
      - name: Upload the build artifact
        uses: actions/upload-artifact@v4
        with:
          name: parking-app
          path: dist/
      - name: Check the weekday rates
        run: python scripts/rate_check.py weekday
      - name: Check the weekend rates
        run: python scripts/rate_check.py weekend
